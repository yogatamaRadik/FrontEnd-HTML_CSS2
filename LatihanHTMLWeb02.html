<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan Web02</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Times New Roman", Times, serif;
      background: #fafafa;
      color: #333;
      padding: 2rem;
    }

    .form-card {
      max-width: 48rem;
      margin: 0 auto;
      background: #fff;
      border: 2px solid #9ca3af;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .form-group {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .form-group.address {
      align-items: center; /* buat label Address sejajar tengah textarea */
    }

    .form-label {
      min-width: 120px;
      font-size: 1.1rem;
    }

    input, textarea {
      flex: 1;
      font-family: "Times New Roman", Times, serif;
      font-size: 1rem;
      padding: 0.5rem 0.75rem;
      border: 2px solid #9ca3af;
      border-radius: 4px;
      color: #333;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #6b7280;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    input::placeholder, textarea::placeholder {
      color: #9ca3af;
    }

    .postcode {
      max-width: 20rem;
    }
  </style>
</head>
<body>
  <div class="form-card">
    <form>
      <div class="form-group">
        <label for="name" class="form-label">Name:</label>
        <input type="text" id="name" name="name" placeholder="your name here">
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email:</label>
        <input type="email" id="email" name="email" placeholder="your email here">
      </div>

      <div class="form-group address">
        <label for="address" class="form-label">Address:</label>
        <textarea id="address" name="address" placeholder="25 Nowhere Street&#10;Somewhere&#10;Not Here&#10;Y2R 5RD" rows="6"></textarea>
      </div>

      <div class="form-group">
        <label for="postcode" class="form-label">Postcode:</label>
        <input type="text" id="postcode" name="postcode" class="postcode" placeholder="postal code">
      </div>
    </form>
  </div>
</body>
</html>
